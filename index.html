<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMS Tools</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .topbar {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 20px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .tab-button {
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        color: #374151;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 14px;
      }
      .tab-button.active {
        background: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
      }
      .tab-frame {
        border: 0;
        display: none;
        flex: 1;
        width: 100%;
      }
      .tab-frame.active {
        display: block;
      }

      /* ── Global Priority Toast System ────────────────────────────────────── */
      #gNotifyBox {
        position: fixed;
        bottom: 22px;
        left: 22px;
        z-index: 9999;
        display: flex;
        flex-direction: column-reverse;
        gap: 10px;
        max-width: 360px;
      }
      .g-toast {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: #1e1b4b;
        color: #f0f4ff;
        padding: 13px 16px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,.25);
        font-size: 13px;
        font-family: 'Segoe UI', Arial, sans-serif;
        line-height: 1.5;
        max-width: 360px;
        opacity: 0;
        transform: translateX(-24px);
        animation: gSlideIn .3s forwards, gFadeOut .35s 4.65s forwards;
        pointer-events: none;
      }
      .g-toast-icon {
        font-size: 20px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .g-toast-body { flex: 1; }
      .g-toast-priority {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .g-toast.p1 { border-left: 4px solid #ef4444; }
      .g-toast.p1 .g-toast-priority { background: #ef4444; color: #fff; }
      .g-toast.p2 { border-left: 4px solid #f59e0b; }
      .g-toast.p2 .g-toast-priority { background: #f59e0b; color: #1f2937; }
      .g-toast.p3 { border-left: 4px solid #8b5cf6; }
      .g-toast.p3 .g-toast-priority { background: #8b5cf6; color: #fff; }
      .g-toast-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
      .g-toast-sub { font-size: 12px; color: #a5b4fc; }
      @keyframes gSlideIn {
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes gFadeOut {
        to { opacity: 0; transform: translateX(-16px); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="tabs">
          <button
            class="tab-button"
            type="button"
            data-frame-target="nvnSolutionsFrame"
          >
            NVN Solutions
          </button>
          <button
            class="tab-button"
            type="button"
            data-frame-target="callLogFrame"
          >
            Call Log
          </button>
          <button
            class="tab-button"
            type="button"
            data-frame-target="sumaryticketFrame"
          >
            Sumary Ticket
          </button>
          <button
            class="tab-button"
            type="button"
            data-frame-target="vanMauNVNFrame"
          >
            Văn mẫu NVN
          </button>
          <button
            class="tab-button active"
            type="button"
            data-frame-target="taskPendingFrame"
          >
            Task Pending NVN
          </button>
        </div>
      </div>

      <iframe
        class="tab-frame"
        id="nvnSolutionsFrame"
        src="nvn_solutions.html"
        title="NVN Solutions"
      ></iframe>
      <iframe
        class="tab-frame"
        id="callLogFrame"
        src="call_log.html"
        title="Call Log"
      ></iframe>
      <iframe
        class="tab-frame"
        id="sumaryticketFrame"
        src="sumary_ticket.html"
        title="Sumary Ticket"
      ></iframe>
      <iframe
        class="tab-frame"
        id="vanMauNVNFrame"
        src="van_mau_nvn.html"
        title="Văn mẫu NVN"
      ></iframe>
      <iframe
        class="tab-frame active"
        id="taskPendingFrame"
        src="task_pending_nvn.html"
        title="Task Pending NVN"
      ></iframe>
    </div>

    <script>
      const tabButtons = Array.from(document.querySelectorAll(".tab-button"));
      const tabFrames = Array.from(document.querySelectorAll(".tab-frame"));

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const targetId = button.dataset.frameTarget;
          tabButtons.forEach((item) => {
            item.classList.toggle("active", item === button);
          });
          tabFrames.forEach((frame) => {
            frame.classList.toggle("active", frame.id === targetId);
          });
        });
      });
    </script>

    <!-- ── Global Priority Notification System ── -->
    <div id="gNotifyBox"></div>
    <script>
    (function() {
      /* ── Config ── */
      const PRIORITY_INTERVALS = { P1: 3600000, P2: 10800000, P3: 86400000 };
      const LS_TASKS_KEY    = "app_tasks_data";
      const LS_NOTIFIED_KEY = "task_last_notified";
      const CHECK_INTERVAL  = 60000; // check every 1 min

      const ICONS  = { P1: "🚨", P2: "⚠️", P3: "📣" };
      const LABELS = { P1: "🔴 P1 – Khẩn cấp", P2: "🟡 P2 – Cao", P3: "🟣 P3 – Thường" };

      function loadTimestamps() {
        try { return JSON.parse(localStorage.getItem(LS_NOTIFIED_KEY) || "{}"); }
        catch(e) { return {}; }
      }
      function saveTimestamps(ts) {
        try { localStorage.setItem(LS_NOTIFIED_KEY, JSON.stringify(ts)); } catch(e) {}
      }

      function showGToast(task) {
        const box = document.getElementById("gNotifyBox");
        if (!box) return;
        const p = (task.priority || "P3").toLowerCase();
        const el = document.createElement("div");
        el.className = `g-toast ${p}`;
        const issue = (task.issue || "").substring(0, 80);
        const assignees = (task.assignees || []).join(", ") || "Chưa phân công";
        el.innerHTML = `
          <div class="g-toast-icon">${ICONS[task.priority] || "📣"}</div>
          <div class="g-toast-body">
            <div class="g-toast-priority">${LABELS[task.priority] || task.priority}</div>
            <div class="g-toast-title">${escHtml(issue)}</div>
            <div class="g-toast-sub">▶ ${escHtml(assignees)}</div>
          </div>
        `;
        box.prepend(el);
        setTimeout(() => el.remove(), 5100);
      }

      function escHtml(s) {
        return String(s || "")
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      function checkAndNotify() {
        let tasks;
        try { tasks = JSON.parse(localStorage.getItem(LS_TASKS_KEY) || "[]"); }
        catch(e) { return; }

        const now = Date.now();
        const ts  = loadTimestamps();
        let updated = false;

        tasks.forEach(task => {
          if (task.status === "Done") return;
          const p    = task.priority || "P3";
          const intv = PRIORITY_INTERVALS[p] || PRIORITY_INTERVALS.P3;
          const last = ts[task.id] || 0;

          if ((now - last) >= intv) {
            showGToast(task);
            ts[task.id] = now;
            updated = true;
          }
        });

        if (updated) saveTimestamps(ts);
      }

      document.addEventListener("DOMContentLoaded", () => {
        checkAndNotify();
        setInterval(checkAndNotify, CHECK_INTERVAL);
      });
    })();
    </script>
  </body>
</html>
